# Offline verification gates for this publishing repository. Nothing here
# dispatches the publish workflow, publishes, or mutates any registry state.

name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  content:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Pin Node.js 22.14.0
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22.14.0"

      - name: Check public content rules
        run: node scripts/check-public-content.mjs

      - name: Lint workflows with pinned actionlint
        run: |
          set -euo pipefail
          curl --silent --show-error --location --output actionlint.tar.gz \
            https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz
          echo "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  actionlint.tar.gz" | sha256sum --check
          tar -xzf actionlint.tar.gz actionlint
          ./actionlint
          rm -f actionlint actionlint.tar.gz

  package:
    strategy:
      fail-fast: false
      matrix:
        node-version: ["20.x", "22.x"]
    runs-on: ubuntu-24.04
    steps:
      - name: Check out
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up Node ${{ matrix.node-version }}
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ matrix.node-version }}

      - name: Check the packed file set and manifest truth
        run: node scripts/check-packed-files.mjs

      - name: Exercise tool-surface drift negatives
        run: node scripts/test-tool-surface.mjs

      - name: Smoke-test the installed artifact (help, stdio, exact pinned 18-tool surface)
        run: node scripts/smoke-installed.mjs

  publish-guard:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Pin Node.js 22.14.0
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22.14.0"

      - name: Exercise publish-guard negative cases (no dispatch, no publish)
        run: bash scripts/test-publish-preconditions.sh
